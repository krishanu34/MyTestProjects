# Application properties configuration file

# Spring Boot Application Settings
spring.application.name=mdot-sso-service
server.port=8080
spring.profiles.active=dev

# Hibernate and JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# DataSource Configuration (Development Environment)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Logging Configuration
logging.level.root=INFO
logging.level.com.mdot=DEBUG

# Custom Properties (External Services)
external.oracle.service.timeout=5000 # Timeout in milliseconds
external.oracle.service.base-url=http://localhost:8081/oracle-service

# Profiles Switching (Development/Profile-specific settings)
management.endpoints.web.exposure.include=*
management.security.enabled=false